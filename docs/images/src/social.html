<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #0a1628; position: relative; }
  .bg { position: absolute; inset: 0;
        background-image: url('src/background.jpg');
        background-size: cover; background-position: center right; }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(100deg,
      rgba(7,16,32,.97) 0%, rgba(7,16,32,.90) 38%,
      rgba(7,16,32,.50) 60%, rgba(7,16,32,0) 80%); }
  .content { position: absolute; left: 86px; top: 50%; transform: translateY(-50%); width: 760px; }
  h1 { font-size: 88px; font-weight: 800; letter-spacing: 6px; color: #fff; line-height: 1.05; }
  .en { font-family: "Segoe UI", Arial, sans-serif; font-size: 46px; font-weight: 700;
        letter-spacing: 4px; color: #4a9aff; margin-top: 6px; }
  .rule { width: 130px; height: 5px; margin: 22px 0;
          background: linear-gradient(90deg,#ffb454,#4a9aff); border-radius: 3px; }
  .tagline { font-size: 29px; font-weight: 700; color: #d6e7ff; letter-spacing: 2px; }
  .sub { margin-top: 10px; font-size: 20px; color: #7fa3cc; }
  .foot { position: absolute; left: 86px; bottom: 44px; display: flex; gap: 18px;
          font-size: 17px; color: #5d7fa8; }
  .foot b { color: #ffb454; }
  .foot i { font-style: normal; color: #2f4a6b; }
</style>
</head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="content">
    <h1>标书匠</h1>
    <div class="en">BidCraft</div>
    <div class="rule"></div>
    <div class="tagline">开源对话式工程标书编制智能体</div>
    <div class="sub">让 AI 写完技术标的初稿，你只做审核和补图</div>
  </div>
  <div class="foot">
    <span>LLM-Wiki</span><i>|</i><span>标段隔离</span><i>|</i>
    <span>事实可追溯</span><i>|</i><b>Apache-2.0</b>
  </div>
</body>
</html>
