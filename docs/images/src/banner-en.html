<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
    background: #0a1628; position: relative;
  }
  .bg {
    position: absolute; inset: 0;
    background-image: url('src/background.jpg');
    background-size: cover; background-position: center right;
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      rgba(7, 16, 32, 0.96) 0%,
      rgba(7, 16, 32, 0.88) 32%,
      rgba(7, 16, 32, 0.45) 54%,
      rgba(7, 16, 32, 0.0) 74%);
  }
  .content {
    position: absolute; left: 190px; top: 50%;
    transform: translateY(-50%); width: 1360px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 16px 34px;
    border: 2px solid rgba(74, 154, 255, 0.5);
    border-radius: 999px;
    background: rgba(30, 90, 170, 0.22);
    margin-bottom: 54px;
  }
  .badge span {
    font-size: 31px; font-weight: 600; letter-spacing: 6px; color: #8ec5ff;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #4a9aff;
         box-shadow: 0 0 16px 3px rgba(74,154,255,.85); }
  h1 {
    font-size: 168px; font-weight: 800; letter-spacing: 2px;
    color: #ffffff; line-height: 1.06;
    text-shadow: 0 8px 44px rgba(0, 40, 100, 0.85);
  }
  .cn {
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 80px; font-weight: 700; letter-spacing: 16px;
    color: #4a9aff; margin-top: 20px;
    text-shadow: 0 0 40px rgba(74,154,255,.45);
  }
  .rule {
    width: 250px; height: 8px; margin: 52px 0 52px;
    background: linear-gradient(90deg, #ffb454 0%, #4a9aff 100%);
    border-radius: 4px;
  }
  .tagline {
    font-size: 62px; font-weight: 700; letter-spacing: 1px;
    color: #d6e7ff; line-height: 1.42;
  }
  .sub {
    margin-top: 30px; font-size: 40px; font-weight: 400;
    color: #7fa3cc; line-height: 1.6;
  }
  .foot {
    position: absolute; left: 190px; bottom: 96px;
    display: flex; align-items: center; gap: 28px;
    font-size: 30px; color: #5d7fa8; letter-spacing: 2px;
  }
  .foot b { color: #ffb454; font-weight: 700; }
  .foot i { font-style: normal; color: #2f4a6b; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scrim"></div>

  <div class="content">
    <div class="badge"><i class="dot"></i><span>OPEN SOURCE · FREE · SELF-HOSTED</span></div>
    <h1>BidCraft</h1>
    <div class="cn">标书匠</div>
    <div class="rule"></div>
    <div class="tagline">Conversational AI Agent for<br/>Engineering Bid Documents</div>
    <div class="sub">Let AI draft your technical proposal — you review and refine.</div>
  </div>

  <div class="foot">
    <span>LLM-Wiki Knowledge</span><i>|</i>
    <span>Lot Isolation</span><i>|</i>
    <span>Traceable Facts</span><i>|</i>
    <b>Apache-2.0</b>
  </div>
</body>
</html>
